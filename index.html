<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuramaps Email</title>

<style>

body{
    margin:0;
    padding:25px 10px;
    background:#f3f5f7;
    font-family: "Segoe UI", Arial, sans-serif;
}

.container{
    max-width:700px;
    margin:auto;
    background:#ffffff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.header img{
    display:block;
    width:100%;
    height:auto;
}

.content{
    padding:70px 40px;
    text-align:center;
    font-family: "Segoe UI", Arial, sans-serif;
}

.content h1{
    margin:0;
    color:#0B7D3E;
    font-size:36px;
    font-weight:bold;
    font-family: "Segoe UI", Arial, sans-serif;
}

.content p{
    margin:55px auto;
    max-width:520px;
    font-size:22px;
    font-family: "Segoe UI", Arial, sans-serif;
    text-align:justify;
    line-height:1.7;
    color:#555;
}

.button{
    display:inline-block;
    margin-top:15px;
    background:#0B7D3E;
    color:#ffffff !important;
    text-decoration:none;
    padding:18px 55px;
    border-radius:10px;
    font-size:24px;
    font-weight:600;
    font-family: "Segoe UI", Arial, sans-serif;
}

.footer{
    border-top:1px solid #ececec;
    padding:45px 25px;
    text-align:center;
}

.footer h2{
    color:#0B7D3E;
    margin:0;
    font-size:28px;
}

.tagline{
    margin-top:18px;
    font-size:22px;
    color:#444;
    line-height:1.6;
}

.links{
    margin-top:35px;
}

.links a{
    color:#0B7D3E;
    text-decoration:none;
    margin:0 12px;
    font-size:18px;
    font-weight:600;
}

.email{
    margin-top:18px;
    color:#555;
    font-size:17px;
}

.copy{
    margin-top:30px;
    color:#777;
    font-size:15px;
}

@media only screen and (max-width:600px){

.content{
    padding:45px 25px;
}

.content h1{
    font-size:32px;
}

.content p{
    font-size:18px;
}

.button{
    display:block;
    max-width:260px;
    margin:20px auto 0;
    text-align:center;
}

.links a{
    display:block;
    margin:12px 0;
}

.footer h2{
    font-size:30px;
}

.tagline{
    font-size:18px;
}

}

</style>

</head>
